    <div class="container">
        <br><br>
        <div class="row">
            <div class="col"></div>
            <div class="col-7"><div id="CalendarioWeb"></div></div>
            <div class="col"></div>
        </div>
    </div>

    <script>
        // ===== NUEVO: pedir permiso de notificaciones del navegador al cargar =====
        $(document).ready(function(){
            if(Notification.permission !== 'granted' && Notification.permission !== 'denied'){
                Notification.requestPermission();
            }

            $('#CalendarioWeb').fullCalendar({
                header:{
                    left: 'today,prev,next',
                    center: 'title',
                    right: 'month,basicWeek,basicDay,agendaWeek,agendaDay'
                },
                dayClick: function(date, jsEvent, view){
                    $('#btnAgregar').prop('disabled', false);
                    $('#btnModificar').prop('disabled', true);
                    $('#btnEliminar').prop('disabled', true);
                    
                    limpiarFormulario();
                    $('#txtFecha').val(date.format());
                    $("#exampleModal").modal();
                },
                events: 'eventos.php',
                eventClick: function(calEvent, jsEvent, view){
                    $('#btnAgregar').prop('disabled', true);
                    $('#btnModificar').prop('disabled', false);
                    $('#btnEliminar').prop('disabled', false);
                    
                    // Recuperar datos del evento seleccionado
                    $('#txtID').val(calEvent.id);
                    $('#txtTitulo').val(calEvent.title);
                    $('#txtColor').val(calEvent.color);
                    $('#txtDescripcion').val(calEvent.descripcion);
                    $('#txtTextColor').val(calEvent.textColor || '#FFFFFF');
                    
                    FechaHora = calEvent.start.format().split("T");
                    $('#txtFecha').val(FechaHora[0]);
                    $('#txtHora').val(FechaHora[1] ? FechaHora[1].substring(0,5) : '10:30');
                    
                    $("#exampleModal").modal();
                },
                // ===== NUEVO: se dispara cada vez que el calendario termina de pintar eventos =====
                eventAfterAllRender: function(view){
                    revisarVencimientos();
                }
            });
        });

        // ===== NUEVO: revisa eventos próximos a vencer y avisa =====
        function revisarVencimientos(){
            var hoy = moment().startOf('day');
            var eventos = $('#CalendarioWeb').fullCalendar('clientEvents');
            var avisados = JSON.parse(localStorage.getItem('avisados') || '[]');
            var porVencer = [];

            eventos.forEach(function(evento){
                var dias = evento.start.startOf('day').diff(hoy, 'days');
                if(dias >= 0 && dias <= 15){
                    porVencer.push(evento);

                    // Notificación del navegador, solo una vez por evento
                    if(avisados.indexOf(evento.id) === -1){
                        if(Notification.permission === 'granted'){
                            new Notification('Equipo por vencer', {
                                body: evento.title + ' — vence en ' + dias + ' días'
                            });
                        }
                        avisados.push(evento.id);
                    }
                }
            });

            localStorage.setItem('avisados', JSON.stringify(avisados));

            // Aviso visual arriba del calendario
            $('#avisoVencimientos').remove();
            if(porVencer.length > 0){
                var html = '<div id="avisoVencimientos" class="alert alert-warning">';
                html += '<strong>' + porVencer.length + ' equipo(s) por vencer:</strong><ul class="mb-0">';
                porVencer.forEach(function(e){
                    html += '<li>' + e.title + '</li>';
                });
                html += '</ul></div>';
                $('#CalendarioWeb').before(html);
            }
        }

        // ===== DELEGACIÓN DE EVENTOS (funciona aunque el modal esté después) =====
        var NuevoEvento;

        $(document).on('click', '#btnAgregar', function(){
            RecolectarDatosGUI();
            EnviarInformacion('agregar', NuevoEvento);
        });

        $(document).on('click', '#btnEliminar', function(){
            RecolectarDatosGUI();
            EnviarInformacion('eliminar', NuevoEvento);
        });

        $(document).on('click', '#btnModificar', function(){
            RecolectarDatosGUI();
            EnviarInformacion('modificar', NuevoEvento);
        });

        function RecolectarDatosGUI(){
            NuevoEvento = {
                id: $('#txtID').val(),
                title: $('#txtTitulo').val(),
                descripcion: $('#txtDescripcion').val(),
                color: $('#txtColor').val() || '#ff0000',
                textColor: $('#txtTextColor').val() || '#FFFFFF',
                start: $('#txtFecha').val() + " " + $('#txtHora').val(),
                end: $('#txtFecha').val() + " " + $('#txtHora').val()
            };
        }

        function EnviarInformacion(accion, objEvento){
            $.ajax({
                type: 'POST',
                url: 'eventos.php?accion=' + accion,
                data: objEvento,
                success: function(msg){
                    try {
                        var res = (typeof msg === 'string') ? JSON.parse(msg) : msg;
                        if(res && res.ok !== false){
                            $('#CalendarioWeb').fullCalendar('refetchEvents');
                            $("#exampleModal").modal('hide');
                        } else {
                            alert(res.mensaje || 'Error al guardar el evento');
                        }
                    } catch(e) {
                        console.error('Respuesta del servidor:', msg);
                        // Si no es JSON válido pero hay respuesta, intentamos refrescar
                        if(msg){
                            $('#CalendarioWeb').fullCalendar('refetchEvents');
                            $("#exampleModal").modal('hide');
                        } else {
                            alert('Error en la respuesta del servidor');
                        }
                    }
                },
                error: function(xhr, status, error){
                    console.error(xhr.responseText);
                    alert("Hay un error en la petición...");
                }
            });
        }

        function limpiarFormulario(){
            $('#txtID').val('');
            $('#txtTitulo').val('');
            $('#txtDescripcion').val('');
            $('#txtColor').val('#ff0000');
            $('#txtTextColor').val('#FFFFFF');
            $('#txtHora').val('10:30');
        }
    </script>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">Evento</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="txtID" name="txtID">
            <input type="hidden" id="txtFecha" name="txtFecha">

            <div class="form-row">
                <div class="form-group col-md-12">
                    <label>Título:</label>
                    <input type="text" id="txtTitulo" class="form-control" placeholder="Título del evento">
                </div>
                <div class="form-group col-md-4">
                    <label>Hora del evento:</label>
                    <div class="input-group clockpicker" data-autoclose="true">
                        <input type="text" id="txtHora" value="10:30" class="form-control">
                    </div>
                </div>
                <div class="form-group col-md-12">
                    <label>Descripción:</label>
                    <textarea id="txtDescripcion" rows="3" class="form-control"></textarea>
                </div>
                <div class="form-group col-md-6">
                    <label>Color de fondo:</label>
                    <input type="color" value="#ff0000" id="txtColor" class="form-control" style="height:36px;">
                </div>
                <div class="form-group col-md-6">
                    <label>Color del texto:</label>
                    <input type="color" value="#FFFFFF" id="txtTextColor" class="form-control" style="height:36px;">
                </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" id="btnAgregar" class="btn btn-success">Agregar</button>
            <button type="button" id="btnModificar" class="btn btn-success">Modificar</button>
            <button type="button" id="btnEliminar" class="btn btn-danger">Borrar</button>
            <button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
          </div>
        </div>
      </div>
    </div>
